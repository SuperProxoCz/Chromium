name: Build Desktop Android Chromium with H264

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space™
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Tools™
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Chromium Source™
        run: |
          fetch --no-history --no-hooks android
          cd src
          ./build/install-build-deps.sh --android
          gclient runhooks

      - name: Configure GN Args
        run: |
          cd src
          mkdir -p out/Default
          echo 'target_os = "android"' > out/Default/args.gn
          echo 'target_cpu = "arm64"' >> out/Default/args.gn
          echo 'is_debug = false' >> out/Default/args.gn
          echo 'is_official_build = true' >> out/Default/args.gn
          echo 'symbol_level = 0' >> out/Default/args.gn
          echo 'is_desktop_android = true' >> out/Default/args.gn
          echo 'proprietary_codecs = true' >> out/Default/args.gn
          echo 'ffmpeg_branding = "Chrome"' >> out/Default/args.gn
          gn gen out/Default

      - name: Compile APK
        run: |
          cd src
          autoninja -C out/Default chrome_public_apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromePublic-AndroidDesktop-H264
          path: src/out/Default/apks/ChromePublic.apk
          
