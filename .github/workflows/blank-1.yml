name: Build Desktop Android Chromium with H264

on:
  workflow_dispatch:
    inputs:
      fetch_sources:
        description: 'Fetch Chromium sources with depot_tools (may be long)'
        required: false
        default: 'false'
      install_deps:
        description: 'Run install-build-deps.sh (heavy)'
        required: false
        default: 'false'
      compile:
        description: 'Run autoninja build (very long). Set true to compile.'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space™
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean || true

      - name: Cache depot_tools
        id: cache-depot
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/depot_tools
          key: depot-tools-${{ runner.os }}-v1

      - name: Ensure depot_tools on PATH
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $GITHUB_WORKSPACE/depot_tools
          fi
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Cache Chromium sources
        id: cache-sources
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/src
          key: chromium-sources-${{ runner.os }}-v1
          restore-keys: |
            chromium-sources-${{ runner.os }}-

      - name: Chromium Source™ (fetch)
        if: ${{ github.event.inputs.fetch_sources == 'true' }}
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/src" ]; then
            fetch --no-history --no-hooks android
          fi
          cd src
          gclient runhooks

      - name: Install build deps (optional)
        if: ${{ github.event.inputs.install_deps == 'true' && github.event.inputs.fetch_sources == 'true' }}
        run: |
          cd src
          ./build/install-build-deps.sh --android

      - name: Configure GN Args
        if: ${{ github.event.inputs.fetch_sources == 'true' }}
        run: |
          cd src
          mkdir -p out/Default
          cat > out/Default/args.gn << 'EOF'
target_os = "android"
target_cpu = "arm64"
is_debug = false
is_official_build = true
symbol_level = 0
blink_symbol_level = 0

# Desktop Android Layout + H.264 Codecs
is_desktop_android = true
proprietary_codecs = true
ffmpeg_branding = "Chrome"

# Optimization & Size Reduction
use_lto = true
enable_lto_on_non_official_builds = true
v8_use_snapshot = false
v8_enable_builtins_optimization = false

# Disable unnecessary features
enable_nacl = false
enable_wayland_server = false
use_vaapi = false
use_cups = false
enable_remoting = false
enable_reporting = false
enable_extensions = false
v8_enable_gdbjit = false
enable_mse_mpeg2ts_stream_parser = false
is_component_build = false

# Strip binaries
strip_absolute_paths_from_debug_symbols = true
EOF
          gn gen out/Default || true

      - name: Cache build artifacts
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/src/out/Default
          key: chromium-build-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            chromium-build-${{ runner.os }}-

      - name: Compile APK (optional)
        if: ${{ github.event.inputs.compile == 'true' && github.event.inputs.fetch_sources == 'true' }}
        run: |
          cd src
          autoninja -C out/Default -j $(nproc) chrome_public_apk

      - name: Strip & Compress APK
        if: ${{ github.event.inputs.compile == 'true' && github.event.inputs.fetch_sources == 'true' && success() }}
        run: |
          cd src/out/Default/apks
          # Get original size
          ORIG_SIZE=$(du -h ChromePublic.apk | cut -f1)
          echo "Original APK: $ORIG_SIZE"
          
          # Try upx compression if available
          if command -v upx &> /dev/null; then
            upx --best --lzma ChromePublic.apk -o ChromePublic-upx.apk 2>/dev/null || true
            if [ -f ChromePublic-upx.apk ]; then
              COMPRESSED_SIZE=$(du -h ChromePublic-upx.apk | cut -f1)
              echo "Compressed APK: $COMPRESSED_SIZE"
              mv ChromePublic-upx.apk ChromePublic.apk
            fi
          fi

      - name: Upload APK (only when compiled)
        if: ${{ github.event.inputs.compile == 'true' && github.event.inputs.fetch_sources == 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ChromePublic-AndroidDesktop-H264
          path: src/out/Default/apks/ChromePublic.apk
          compression-level: 9

      - name: Skipped compile notice
        if: ${{ github.event.inputs.compile != 'true' }}
        run: |
          echo "compile input is not true — build/compile steps were skipped to avoid long runtimes. To run a full compile, re-run workflow and set compile=true."
